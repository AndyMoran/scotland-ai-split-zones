  # EMPIRICAL DEFENSE OF 2-HOUR DURATION (100 MWh nameplate, 85 MWh usable):
  #
  # Usable capacity band: 95% - 10% = 85 MWh (SoC-constrained, not nameplate).
  # Per-event discharge cap (any event, due to 1hr handoff): 50 MWh max.
  #
  # TWO EXPERIMENTS, TWO NUMBERS (Based on verified 2023-2024 Historical SCOTEX Data):
  #
  # Experiment 1: Chain Depth (No Recharge, Hypothetical Worst Case)
  # - Total historical constraint events: 222. Total 0.5h (P10) events: 59.
  # - P10 chain depth across all events = 2 events survived.
  # - Starting from 0.5h (P10) events: 100% survive 2+ events, 100% survive 3+ events.
  # - This establishes a conservative reliability floor assuming zero recharge across 
  #   potentially many hours or days.
  #
  # Experiment 2: Rolling Window Density (Realistic Operational Clustering)
  # - 0.0% of 2-hour windows contain 3+ events (max observed = 2 events).
  # - 3.6% of 4-hour windows contain 3+ events.
  # - 0.0% of 4-hour windows contain 4+ events.
  # - This proves genuine multi-event clustering within tight operational windows is rare.
  #
  # LAYERED CONCLUSION:
  # The 2-hour spec (85 MWh usable) guarantees handoff coverage for at least 2 
  # consecutive qualifying events in the worst historical decile, and for 100% of 
  # chains beginning with a 0.5h P10 event up to 3 events deep. Genuine 3+ event 
  # clustering within a 4-hour window occurs in only 3.6% of cases historically. 
  # The deeper tail risk in the no-recharge simulation is substantially mitigated 
  # in practice by recharge opportunity during the multi-hour gaps (median gap = 4.0h) 
  # that separate most real event sequences.
  #
  # WORST-CASE SCENARIO (Chain Depth = 1):
  # The simulation identifies exactly one historical sequence where the battery 
  # fails under the zero-recharge assumption: a 26.5-hour marathon constraint event 
  # (2024-12-30 21:30 UTC to 2024-12-31 23:30 UTC). The battery discharges the 
  # 50 MWh handoff cap in the first hour, leaving 35 MWh usable. Under the strict 
  # "zero-recharge" assumption, the subsequent chronological event breaches the floor. 
  # In operational reality, the multi-day clear grid period following a 26.5h event 
  # provides ample opportunity to recharge to 95% SoC, making this a hypothetical 
  # mathematical floor, not a forecasted operational failure.
  #
  # CONSERVATIVE ASSUMPTION: No inter-event recharge is modelled in the chain 
  # depth simulation. This intentionally overstates depletion risk to establish 
  # a safe lower bound for reliability planning.
  #
  # HANDOFF CAP: The battery's maximum obligation per event is bounded at 50 MWh 
  # (1hr × 50 MW) regardless of event duration. A 26.5h event does not require 
  # 1,325 MWh from the battery — only the first 50 MWh, after which the AI load 
  # has ramped down and the constraint is managed by the paused-AI state.

# SIMPLIFYING ASSUMPTION: Constant Magnitude Response
# This model assumes every constraint event requires full AI/battery response
# (100 MW for AI, 50 MW for battery). In reality, events vary in magnitude
# (Flow - Limit), and per-event capture is bounded by min(response_capacity, magnitude).
#
# Note this bound saturates: events with actual magnitude >= 50 MW are UNAFFECTED
# by this simplification (the battery's marginal capture is already 50 MWh, the
# true ceiling). Overstatement only occurs for events where magnitude < 50 MW.
# The scale of the correction is therefore proportional to how many of the 163
# handoff events fall below that threshold — unquantified pending a rerun against
# raw Flow-Limit data — not a uniform scaling of the full £0.79M/year figure.
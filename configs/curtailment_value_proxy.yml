curtailment_value_proxy:
  source_name: "NESO Day Ahead Constraint Flows and Limits (Filtered 2023-2024 Historical)"
  publication_year: 2024
  geography: "Scotland (SCOTEX and SSEN-S boundaries)"
  boundary_or_zone: "SCOTEX (primary), SSEN-S"
  
  # VERIFIED HISTORICAL VOLUME (2023-2024)
  scottish_thermal_constraint_volume_twh_2yr: 3.53
  scottish_thermal_constraint_volume_twh_annualized: 1.76
  
  # COST PROXY
  gb_wide_average_constraint_cost_gbp_per_mwh: 164.89
  
  # THEORETICAL UPPER BOUND (Before friction costs & physical incompatibility)
  theoretical_upper_bound_gbp_2yr: 583000000  # ~£583M total over 2 years
  theoretical_upper_bound_gbp_annualized: 291000000  # ~£291M per year
  
  value_type: "Theoretical ceiling based on cost-proportion allocation"
  notes: >
    Volume calculated by summing only historical half-hours where Flow > Limit 
    for 2023-2024, excluding all future Day-Ahead forecast artifacts. 
    Annualized volume (~1.76 TWh/yr) aligns with expected 1-2 TWh/yr Scottish share.
    Real-world capture will be materially lower due to AI-operator friction costs 
    and physical incompatibility of short-duration (P10) events.
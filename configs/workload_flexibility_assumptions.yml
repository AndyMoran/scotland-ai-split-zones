# Workload flexibility and technological velocity assumptions
# All assumptions are config-driven. No magic numbers in notebooks.

real_time_inference:
  flexibility: low
  assumption: "must run when requested"
  shift_window_hours: 0

batch_inference:
  flexibility: medium
  assumption: "can be queued or delayed"
  shift_window_hours: [1, 2, 4]

training_jobs:
  flexibility: medium_high
  assumption: "schedulable at job start/stop level; modern async checkpointing enables sub-hour notice"

  # Decomposed notice model (Milestone 2.3, empirically grounded 2024-25)
  notice_decomposition_hours:
    checkpoint_write: 0.08        # ~5 min (async, 200GB @ 4GB/s NVMe)
    orchestration_cooling: 0.17   # ~10 min (automated K8s drain / NCCL re-init)
    grid_protocol: 0.33           # ~20 min (NESO BM contractual delivery window)
    restart_verification: 0.17    # ~10 min (shard reload + integrity check)
    safety_margin: 0.25           # ~15 min (network latency, partial failures)
    total_baseline: 1.0           # ~1 hour empirical baseline

  # Sensitivity scenarios for Milestone 2.3 trajectory analysis
  notice_scenarios_hours:
    S1_current_2024: 1.0
    S2_near_term_2026: 0.7
    S3_medium_term_2028: 0.4
    S4_optimistic_2030: 0.25

  schedulable_fraction: [0.1, 0.3, 0.5]

  notes: |
    ASSUMPTION EVOLUTION — Conservative Baseline vs Empirical Reality

    The original model used a 12-hour conservative engineering estimate for IT
    notice periods. Milestone 2.3 reconciled this against hyperscaler documentation
    and NESO Balancing Mechanism protocols, revealing modern infrastructure operates
    on a ~1-hour timescale.

    | Phase                    | Legacy (12h) | Empirical (1h) | Evidence                                |
    |--------------------------|--------------|----------------|-----------------------------------------|
    | Checkpoint Write         | 1.0 h        | 0.08 h (~5m)   | Async checkpointing, 200GB @ 4GB/s NVMe |
    | Orchestration & Cooling  | 1.5 h        | 0.17 h (~10m)  | AWS HyperPod / Azure ML automated drain |
    | Grid Protocol            | 2.5 h        | 0.33 h (~20m)  | NESO BM 20-min contractual delivery     |
    | Restart Verification     | 3.0 h        | 0.17 h (~10m)  | Shard reload + integrity check          |
    | Safety Margin            | 4.0 h        | 0.25 h (~15m)  | Network latency / partial failures      |
    | TOTAL                    | 12.0 h       | 1.0 h          |                                         |

    Policy implication: the "Timescale Mismatch Trap" is isolated to P10 events
    (<1 hour), which are too short for any large-scale physical response. Median
    Scottish constraint events (1.5-2.0 hours) are fully compatible with modern
    checkpointing. The bottleneck is software implementation, not physics.

    Sources: Meta LLaMA-3 training logs, Google PaLM-2 Pathways paper,
    AWS SageMaker HyperPod docs, Azure ML distributed training guides,
    NESO Balancing Mechanism service specifications.

active_training_runs:
  flexibility: low_medium
  assumption: "not freely interruptible mid-run"
  checkpoint_interruptibility: false_in_baseline

duration_compatibility:
  method: "soft_ratio"
  formula: "min(1, event_duration_hours / minimum_scheduling_notice_hours)"
  hard_gate_available: true

compute_velocity_risk:
  description: "Sensitivity for algorithmic efficiency gains reducing MW demand over the grid asset lifetime."
  baseline_mw_multiplier: 1.0
  stress_test_mw_multiplier: 0.5
  horizon_years: 5
  mechanism: "Algorithmic efficiency reduces the MW required per FLOP, lowering the residual grid burden over time."

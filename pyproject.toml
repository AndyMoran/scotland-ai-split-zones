[project]
name = "scotland-ai-split-zones"
version = "0.1.0"
description = "A constraint-direction siting framework for grid-responsive AI compute in Scotland."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "duckdb>=0.10.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "jupyterlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# ADD THIS BLOCK:
[tool.hatch.build.targets.wheel]
packages = ["src/ai_split_zones"]